# Link the C runtime statically on Windows so rdm.exe runs without the
# Visual C++ Redistributable (no "VCRUNTIME140.dll was not found").
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
