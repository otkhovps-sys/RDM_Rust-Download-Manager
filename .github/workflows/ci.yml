name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all -- --nocapture
      - name: Build app
        if: runner.os == 'Windows'
        run: cargo build -p rdm-gui
      - name: Smoke test - the app starts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:RDM_DATA_DIR = "$env:RUNNER_TEMP\rdm-data"
          $p = Start-Process -FilePath "target\debug\rdm.exe" -PassThru
          Start-Sleep -Seconds 20
          $log = "$env:RDM_DATA_DIR\crash.log"
          if (Test-Path $log) { Get-Content $log; throw "RDM wrote crash.log" }
          if ($p.HasExited) { throw "RDM exited early with code $($p.ExitCode)" }
          Invoke-RestMethod http://127.0.0.1:9614/ping
          # Idle CPU must stay near zero (no busy redraw loop).
          $before = (Get-Process -Id $p.Id).TotalProcessorTime.TotalSeconds
          Start-Sleep -Seconds 15
          $used = (Get-Process -Id $p.Id).TotalProcessorTime.TotalSeconds - $before
          Write-Host ("Idle CPU over 15 s: {0:N2} s ({1:N1}% of one core)" -f $used, ($used / 15 * 100))
          Stop-Process -Id $p.Id
          if ($used -gt 1.5) { throw "RDM uses too much CPU while idle" }

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          for f in extension/*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json'))"
