name: Release

# Builds binaries for every platform and publishes them, together with the
# browser extension, as a GitHub release. Start it by pushing a tag like
# `v1.0.0`, or run it by hand ("Run workflow") with the version to release;
# the tag is then created by the release step.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.0.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: rdm }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: rdm.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: rdm }
          - { os: macos-latest, target: x86_64-apple-darwin, exe: rdm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p rdm-gui
      - name: Smoke test - the app starts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:RDM_DATA_DIR = "$env:RUNNER_TEMP\rdm-data"
          $p = Start-Process -FilePath "target\${{ matrix.target }}\release\rdm.exe" -PassThru
          Start-Sleep -Seconds 20
          $log = "$env:RDM_DATA_DIR\crash.log"
          if (Test-Path $log) { Get-Content $log; throw "RDM wrote crash.log" }
          if ($p.HasExited) { throw "RDM exited early with code $($p.ExitCode)" }
          Invoke-RestMethod http://127.0.0.1:9614/ping
          Stop-Process -Id $p.Id
      - name: Package
        shell: bash
        run: |
          name="rdm-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist/$name/"
          cp -r extension README.md LICENSE "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.*z*

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip extension (Chrome, Edge, Brave, Opera)
        run: cd extension && zip -r "../rdm-extension-chrome-${TAG}.zip" .
      - name: Zip extension (Firefox)
        # Firefox runs MV3 background code as a script and needs an add-on id.
        run: |
          cp -r extension firefox
          jq '.background = {"scripts": ["background.js"]}
              | .browser_specific_settings = {"gecko": {"id": "rdm@rust-download-manager", "strict_min_version": "121.0"}}' \
            extension/manifest.json > firefox/manifest.json
          cd firefox && zip -r "../rdm-extension-firefox-${TAG}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: rdm-extension-*.zip

  publish:
    needs: [build, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: RDM ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
