[workspace]
resolver = "3"
members = ["crates/rdm-core", "crates/rdm-gui"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/otkhovps-sys/rdm"
rust-version = "1.85"

[workspace.dependencies]
rdm-core = { path = "crates/rdm-core" }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small, fast release binaries.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
