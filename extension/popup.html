<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; margin: 0; font: 13px system-ui, sans-serif; color: #222; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #1e88e5; color: #fff; }
    header img { width: 22px; height: 22px; }
    header b { font-size: 14px; }
    section { padding: 10px 12px; border-bottom: 1px solid #eee; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: #e53935; }
    .dot.ok { background: #43a047; }
    label { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    input[type=number] { width: 80px; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow: auto; }
    li { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid #f2f2f2; }
    li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li small { color: #777; }
    button { border: 0; border-radius: 4px; padding: 4px 8px; background: #1e88e5; color: #fff; cursor: pointer; }
    .muted { color: #777; }
  </style>
</head>
<body>
  <header><img src="icons/32.png" alt=""><b>RDM</b></header>
  <section><span id="dot" class="dot"></span><span id="status">Checking...</span></section>
  <section>
    <label><input type="checkbox" id="capture"> Capture browser downloads</label>
    <label>Port <input type="number" id="port" min="1024" max="65535"></label>
  </section>
  <section>
    <b>Media on this page</b>
    <ul id="media"></ul>
  </section>
  <script src="popup.js"></script>
</body>
</html>
